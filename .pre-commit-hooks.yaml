# For teams using the pre-commit framework (https://pre-commit.com):
#   repos:
#     - repo: https://github.com/kevcooper/threat-driven-development
#       rev: v0.1.0
#       hooks:
#         - id: tdd-commit-msg
#         - id: tdd-pre-push
#         - id: tdd-post-commit
- id: tdd-commit-msg
  name: threat delta or declaration (commit)
  entry: tdd git-hook commit-msg
  language: python
  stages: [commit-msg]
  pass_filenames: false
  always_run: true
- id: tdd-pre-push
  name: threat delta or declaration (branch)
  entry: tdd git-hook pre-push
  language: python
  stages: [pre-push]
  pass_filenames: false
  always_run: true
- id: tdd-post-commit
  name: tag commits that resolve mitigations
  entry: tdd git-hook post-commit
  language: python
  stages: [post-commit]
  pass_filenames: false
  always_run: true
