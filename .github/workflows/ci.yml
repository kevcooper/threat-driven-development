name: ci

on:
  push:
    branches: [main]
  pull_request:
    # "edited" re-runs the gate when a No-Threat-Delta line is added to the PR body.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests -t . -v

  threat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # Dogfood: this repository is gated by its own action.
      - uses: ./

  tag-mitigations:
    # Tags the main-branch commits that resolved mitigations (tag name = mitigation id).
    # Runs only on pushes to main, so pull request runs, including forks, never get a
    # write token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - uses: ./
        with:
          tag-mitigations: "true"
