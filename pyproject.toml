[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-tdd"
version = "0.2.1"
description = "Threat Driven Development: threat model deltas as the security equivalent of failing tests"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tdd = "threat_tdd.cli:main"

[project.urls]
Repository = "https://github.com/kevcooper/threat-driven-development"

[tool.setuptools]
packages = ["threat_tdd"]

[tool.setuptools.package-data]
threat_tdd = ["schemas/*.json", "schemas/*.md", "schemas/LICENSE-*"]
